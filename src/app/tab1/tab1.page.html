<!-- search bar -->
<div id="topUI">
    <div class="ui-row">
        <ion-searchbar *ngIf="popSearch" placeholder="Chemical Name" color="dark" animated [(ngModel)]="searchQuery"
            (search)="search($event,true)" (ionSearch)="search($event,true)" (keyup.enter)="search($event,true)" id="searchBar"></ion-searchbar>
        <ion-button *ngIf="!favorite" (click)="addFavorite()" color="tertiary" id="favorite" class="ui-icon-button"
            aria-label="Add favorite">
            <ion-icon name="heart-outline"></ion-icon>
        </ion-button>
        <ion-button *ngIf="favorite" (click)="removeFavorite()" color="tertiary" id="favorite" class="ui-icon-button"
            aria-label="Remove favorite">
            <ion-icon name="heart-sharp"></ion-icon>
        </ion-button>
        <ion-button (click)="scanInput.click()" color="tertiary" class="ui-icon-button" [disabled]="scanning"
            aria-label="Scan label">
            <ion-icon name="camera-outline"></ion-icon>
        </ion-button>
    </div>
    <input #scanInput type="file" accept="image/*" capture="environment" (change)="onScanFile($event)" style="display:none" />
    <div class="ui-row ui-row--end">
        <ion-button (click)="showSettings()" color="tertiary" class="ui-icon-button" aria-label="Settings">
            <ion-icon name="settings-sharp"></ion-icon>
        </ion-button>
    </div>
    <div class="ui-status" *ngIf="searching || scanning || scanError">
        {{ searching ? 'Searching...' : (scanning ? 'Reading label...' : scanError) }}
    </div>
</div>

<!-- Bottom information  -->
<div id="bottomUI">
    {{this.currentChem.getName() + " " + this.currentChem.getFormula()}}
</div>

<!-- favorite button -->

<!-- smiles drawer view -->
<canvas id="twod" style="width:100vw; height:100vh;"></canvas>
