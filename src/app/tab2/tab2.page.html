<!-- Search Bar -->
<div id="topUI">
    <div class="ui-row">
        <ion-searchbar *ngIf="popSearch" placeholder="Chemical Name" color="dark" animated [(ngModel)]="searchQuery"
            (search)="search($event,true)" id="searchBar"></ion-searchbar>
        <ion-button *ngIf="!favorite" (click)="addFavorite()" color="tertiary" id="favorite" class="ui-icon-button"
            aria-label="Add favorite">
            <ion-icon name="heart-outline"></ion-icon>
        </ion-button>
        <ion-button *ngIf="favorite" (click)="removeFavorite()" color="tertiary" id="favorite" class="ui-icon-button"
            aria-label="Remove favorite">
            <ion-icon name="heart-sharp"></ion-icon>
        </ion-button>
    </div>
    <div class="ui-row ui-row--end">
        <ion-button (click)="openAr()" color="tertiary" class="ui-icon-button" [disabled]="arLoading"
            aria-label="Open AR view">
            <ion-icon name="cube-outline"></ion-icon>
        </ion-button>
    </div>
    <div class="ui-status" *ngIf="arLoading || arError">
        {{ arLoading ? 'Building AR model...' : arError }}
    </div>
</div>


<!-- Bottom information  -->
<div id="bottomUI">
    {{this.currentChem.getName() + " " + this.currentChem.getFormula()}}
</div>


<!-- NGL Viewer -->
<div id="threed"></div>

<div class="ar-overlay" *ngIf="arUrl">
    <model-viewer #arViewer [src]="arUrl" ar camera-controls auto-rotate shadow-intensity="1"></model-viewer>
    <div class="ar-actions">
        <ion-button (click)="captureAr()" color="tertiary" class="ar-action">Capture</ion-button>
        <ion-button (click)="closeAr()" color="medium" class="ar-action">Close</ion-button>
    </div>
</div>
